[project]
name = "video-scripts"
version = "0.1.0"
description = "Operator scripts for 8mm and vhs video processing workflows."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false
